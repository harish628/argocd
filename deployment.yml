---
apiVersion: apps/v1
kind: Deployment
metadata:
  name : mydeploy
spec:
   replicas: 3
   selector:
     matchLabels:
       app: paytm
   template:
     metadata:
       name: paytm
       labels:
         app: paytm
     spec:
       containers:
         - name: mycontainer
           image: hariharvis/paytm
           ports:
             - containerPort: 80
